name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read
  packages: write

jobs:
  verify:
    name: Lint, Tests et Build
    runs-on: ubuntu-latest
    env:
      PORT: 3000
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: brume
      DB_PASSWORD: change-me
      DB_NAME: brume
      CORS_ORIGIN: "*"

    steps:
      - name: Recuperer le code source
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Installer les dependances
        run: npm ci

      - name: Verification ESLint
        run: npm run lint

      - name: Execution des tests avec couverture de code
        run: |
          npm run test:cov 2>&1 | tee coverage.log

      - name: Publier le resume de couverture dans le recapitulatif du workflow
        if: always()
        run: |
          echo "### Rapport de couverture de code (Jest)" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          sed -n '/---*|---*/,/---*|---*/p' coverage.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Sauvegarder le rapport de couverture (HTML & LCOV)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-coverage-report-back
          path: coverage/
          retention-days: 14

      - name: Verification du build
        run: npm run build

  build-and-push:
    name: Build Docker et Push GHCR
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code source
        uses: actions/checkout@v4

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion au registre GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraire les metadonnees Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=staging
            type=sha,format=short

      - name: Build et Push de l'image Docker (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploiement sur VM
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [self-hosted, linux]
    steps:
      - name: Connexion au registre GHCR sur la VM
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Executer le deploiement
        run: /opt/filrouge/deploy.sh back
